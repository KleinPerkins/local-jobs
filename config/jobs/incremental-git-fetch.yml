schema: jobs/v1
version: 1
defaults:
  remote: origin
  enabled: true
  filter_blobs: true
  full_fetch_other_refs: false
  ff_only_merge: true
  schedule: inherit
global:
  dev_root: ~/dev
  launchd:
    label: com.kleinperkins.local-jobs.git-fetch
    window_start_hour: 18
    window_end_hour: 24
    use_jitter: true
  logging:
    dir: ~/Library/Logs/local-jobs
repos:
- id: all-the-things
  path: affirm/vendor/all-the-things
  remote: origin
  branch: master
  enabled: true
  filter_blobs: true
  full_fetch_other_refs: false
  ff_only_merge: true
  schedule: inherit

# local-jobs registry (registry/v1)
# The core is type-agnostic: it discovers types here and drives each handler
# through the ABI (see ABI.md). Instances are owned and reported by handlers
# via `list-instances` — they are NOT enumerated here.

schema: registry/v1
version: 1

discovery:
  label_prefix: com.kleinperkins.

job_types:
  incremental-git-fetch:
    description: Incremental filtered git fetch for vendor/reference repos under ~/dev
    handler: handlers/incremental-git-fetch.sh

  cpp-archive:
    description: Daily archive of committed cpp source refs to KleinPerkins/cpp
    handler: handlers/cpp-archive.sh

  command:
    description: Generic scheduled command (arbitrary program + schedule, self-managed plist)
    handler: handlers/command.sh

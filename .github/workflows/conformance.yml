name: conformance

# Overlay smoke checks for the local-jobs operator-private companion repo.
# The full overlay-vs-global integration harness runs locally where the sibling
# private global skills checkout is available.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Overlay static smoke
        run: |
          bash -n install-overlay.sh
          bash -n bin/test-local-overlay.sh
          bash -n handlers/cpp-archive.sh
          python - <<'PY'
          data = {}
          with open("overlay/registry.d/cpp-archive.yml", "r", encoding="utf-8") as fh:
              for line in fh:
                  if ":" in line:
                      k, v = line.split(":", 1)
                      data[k.strip()] = v.strip().strip('"')
          assert data["id"] == "cpp-archive"
          assert data["handler"] == "__INSTALLED_BY_INSTALL_OVERLAY__"
          PY
